<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Peace World</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 {
      font-size: 3rem;
    }

    .input-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-container input {
      margin: 10px;
      padding: 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #00cc99;
      background-color: #333;
      color: #fff;
    }

    .button {
      background-color: #00cc99;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }

    .button:hover {
      background-color: #00ffcc;
    }

    .oyun-alani {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .kelime {
      width: 100px;
      height: 40px;
      margin: 5px;
      background-color: #1f1f1f;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      color: transparent;
    }

    .kelime:hover {
      background-color: #333;
      color: #00ffcc;
    }

    .mesaj {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #00cc99;
      color: #000;
      padding: 30px 40px;
      border-radius: 20px;
      font-size: 2rem;
      display: none;
      z-index: 2;
    }

    .timer {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 1.5rem;
      background: #222;
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid #00cc99;
    }

    .giris-mesaj {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #00cc99;
      color: #000;
      padding: 30px 40px;
      border-radius: 20px;
      font-size: 2rem;
      display: none;
      z-index: 1;
    }
  </style>
</head>
<body>

<!-- Giriş Sayfası -->
<div id="girisSayfasi">
  <h1>Peace World</h1>
  <div class="input-container">
    <input type="text" id="adSoyadInput" placeholder="Adınızı ve Soyadınızı girin" />
    <button class="button" onclick="kontrolEt()">Oyun Başlat</button>
  </div>
</div>

<!-- 30 Saniyelik Mesaj -->
<div id="girisMesaj" class="giris-mesaj">
  Bu oyunun amacı, üstü kapalı kutucukların hangisinde kralınız olan Barış Taliman'ı bulmaktır.
</div>

<!-- Oyun Sayfası -->
<div id="oyunSayfasi" style="display: none;">
  <div class="timer" id="timer">Süre: 15</div>
  <div class="oyun-alani" id="oyun"></div>
  <div id="mesaj" class="mesaj"></div>
</div>

<script>
  const kelimeler = [
    "Kalem", "Defter", "Elma", "Bilgisayar", "Köpek", "Araba", "Ay", "Güneş",
    "Masa", "Kedi", "Kuş", "Yaz", "Kış", "Laptop", "Telefon", "Bardak", "Müzik",
    "Kitap", "Gözlük", "Anahtar", "Yıldız", "Gece", "Sabah", "İnternet", "Çalışma",
    "Web", "Oyun", "Pencere", "Ekran", "Uçak", "Şehir", "Zaman", "Beyin", "Işık",
    "Yol", "Çiçek", "Bahar", "Kış", "Yaz"
  ];

  let zaman = 15;
  let sayaç;
  const oyuncular = ["Ege Yöney", "Efe Yöney", "Kemal Karatoprak", "Barış Taliman"];

  function kontrolEt() {
    const adSoyad = document.getElementById("adSoyadInput").value;

    // Eğer ad soyad listede varsa
    if (oyuncular.includes(adSoyad)) {
      document.getElementById("girisSayfasi").style.display = "none";
      document.getElementById("girisMesaj").style.display = "block";

      // 30 saniye sonra oyuna başla
      setTimeout(() => {
        document.getElementById("girisMesaj").style.display = "none";
        document.getElementById("oyunSayfasi").style.display = "block";
        başlatOyun();
      }, 30000); // 30 saniye bekle
    } else {
      alert("Ad ve soyadınız listede yer almıyor!");
    }
  }

  function başlatOyun() {
    document.getElementById("oyun").innerHTML = "";
    document.getElementById("mesaj").style.display = "none";
    zaman = 15;
    document.getElementById("timer").textContent = `Süre: ${zaman}`;
    clearInterval(sayaç);
    sayaç = setInterval(() => {
      zaman--;
      document.getElementById("timer").textContent = `Süre: ${zaman}`;
      if (zaman <= 0) {
        oyunBitti(false);
      }
    }, 1000);

    const tümKelimeler = [...kelimeler];
    const rastgeleIndex = Math.floor(Math.random() * (tümKelimeler.length + 1));
    tümKelimeler.splice(rastgeleIndex, 0, "Barış Taliman"); // İsim rastgele eklendi
    tümKelimeler.sort(() => Math.random() - 0.5); // Karıştır

    tümKelimeler.forEach(kelime => {
      const div = document.createElement("div");
      div.className = "kelime";
      div.textContent = gizleKelime(kelime); // Kelimeyi gizle
      div.onclick = () => {
        if (kelime === "Barış Taliman") {
          oyunBitti(true);
        }
      };
      document.getElementById("oyun").appendChild(div);
    });
  }

  function gizleKelime(kelime) {
    if (kelime === "Barış Taliman") {
      return "B**** T*****";
    }
    return kelime;
  }

  function oyunBitti(kazandınMı) {
    clearInterval(sayaç);
    document.getElementById("mesaj").textContent = kazandınMı ? "🎉 Kazandın! Barış Taliman'ı Buldun!" : "⏰ Süre bitti! Kaybettin...";
    document.getElementById("mesaj").style.display = "block";

    setTimeout(() => {
      if (confirm("Tekrar oynamak ister misin?")) {
        document.getElementById("girisSayfasi").style.display = "block";
        document.getElementById("oyunSayfasi").style.display = "none";
      }
    }, 2000);
  }
</script>

</body>
</html>
